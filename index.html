<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8e8ea; font: 14px/1.5 system-ui, sans-serif; }
  main { padding: 24px 16px; text-align: center; }

  p.sub { margin: 0 0 20px; color: #9a9ca5; }

  .cell { position: relative; width: 160px; height: 160px; border-radius: 8px; background: #1a1d24; overflow: hidden; }

  .cell svg { display: block; width: 100%; height: 100%; }
  .cell .sig { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: 10px; background: rgba(0, 0, 0, .65); opacity: 0; transition: opacity .15s; }
  .cell:hover .sig { opacity: 1; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(4, 21vw); } .cell { width: 21vw; height: 21vw; } }
</style>
