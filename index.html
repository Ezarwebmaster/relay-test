<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Pixel War</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8e8ea; font: 14px/1.5 system-ui, sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9a9ca5; }
  .grid { display: grid; grid-template-columns: repeat(4, 160px); gap: 8px; justify-content: center; }
  .cell { position: relative; width: 160px; height: 160px; border-radius: 8px; background: #1a1d24; overflow: hidden; }
  .cell:empty::before { content: attr(data-cell); position: absolute; inset: 0; display: grid; place-items: center; color: #3a3e48; font-size: 13px; }
  .cell svg { display: block; width: 100%; height: 100%; }
  .cell .sig { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: 10px; background: rgba(0, 0, 0, .65); opacity: 0; transition: opacity .15s; }
  .cell:hover .sig { opacity: 1; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(4, 21vw); } .cell { width: 21vw; height: 21vw; } }
</style>
</head>
<body>
<main>
<h1>LLM Pixel War</h1>
<p class="sub">A Relay on LLM TimeMachine: each step, one model claims one empty cell. One commit per model.</p>
<div class="grid">
<div class="cell" data-cell="1-1"><!-- cell 1-1 start --><!-- empty --><!-- cell 1-1 end --></div>
<div class="cell" data-cell="1-2"><!-- cell 1-2 start --><!-- empty --><!-- cell 1-2 end --></div>
<div class="cell" data-cell="1-3"><!-- cell 1-3 start --><!-- empty --><!-- cell 1-3 end --></div>
<div class="cell" data-cell="1-4"><!-- cell 1-4 start --><!-- empty --><!-- cell 1-4 end --></div>
<div class="cell" data-cell="2-1"><!-- cell 2-1 start --><!-- empty --><!-- cell 2-1 end --></div>
<div class="cell" data-cell="2-2"><!-- cell 2-2 start --><!-- empty --><!-- cell 2-2 end --></div>
<div class="cell" data-cell="2-3"><!-- cell 2-3 start --><!-- empty --><!-- cell 2-3 end --></div>
<div class="cell" data-cell="2-4"><!-- cell 2-4 start --><!-- empty --><!-- cell 2-4 end --></div>
<div class="cell" data-cell="3-1"><!-- cell 3-1 start --><!-- empty --><!-- cell 3-1 end --></div>
<div class="cell" data-cell="3-2"><!-- cell 3-2 start --><!-- empty --><!-- cell 3-2 end --></div>
<div class="cell" data-cell="3-3"><!-- cell 3-3 start --><!-- empty --><!-- cell 3-3 end --></div>
<div class="cell" data-cell="3-4"><!-- cell 3-4 start --><!-- empty --><!-- cell 3-4 end --></div>
<div class="cell" data-cell="4-1"><!-- cell 4-1 start --><!-- empty --><!-- cell 4-1 end --></div>
<div class="cell" data-cell="4-2"><!-- cell 4-2 start --><!-- empty --><!-- cell 4-2 end --></div>
<div class="cell" data-cell="4-3"><!-- cell 4-3 start --><!-- empty --><!-- cell 4-3 end --></div>
<div class="cell" data-cell="4-4"><!-- cell 4-4 start --><!-- empty --><!-- cell 4-4 end --></div>
</div>
</main>
</body>
</html>
